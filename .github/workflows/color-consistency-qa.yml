name: QA — all template color consistency

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'scripts/qa-all-template-colors.py'
      - '.github/workflows/color-consistency-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  color-contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build all 42 static templates
        run: |
          npm ci
          npm run build
          npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome automation
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Audit resolved colors at 390px and 1440px
        run: |
          python -m http.server 8765 --directory dist --bind 127.0.0.1 >/tmp/awe-color-http.log 2>&1 &
          sleep 2
          python scripts/qa-all-template-colors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-42-template-color-audit
          path: color-qa-output/
          retention-days: 7
