name: Firebase Hosting (Awe Concepts)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'preview/**'
      - 'branded-previews/**'
      - 'tests/branded-previews.test.mjs'
      - 'tests/otaku-haven-preview.test.mjs'
      - 'tests/preview-no-pictographs.test.mjs'
      - 'scripts/build-branded-previews.mjs'
      - 'scripts/validate-preview-icons.mjs'
      - '.github/workflows/branded-previews.yml'
      - '.github/workflows/kappo-sono-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWE_SITE_ORIGIN: https://aweconcepts.com
      FIREBASE_READY: ${{ vars.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Require Firebase deployment credentials
        if: env.FIREBASE_READY != 'true'
        run: |
          echo '::error::Firebase deployment has NOT run. Add repository variable FIREBASE_PROJECT_ID and Actions secret FIREBASE_SERVICE_ACCOUNT. Browser-only setup: see docs/FIREBASE_SETUP.md.'
          exit 1
      - name: Checkout
        if: env.FIREBASE_READY == 'true'
        uses: actions/checkout@v4
      - name: Use Node.js 22
        if: env.FIREBASE_READY == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: env.FIREBASE_READY == 'true'
        run: npm ci
      - name: Build the public site
        if: env.FIREBASE_READY == 'true'
        run: npm run build
      - name: Verify site content and regressions
        if: env.FIREBASE_READY == 'true'
        run: |
          npm run check
          # Preview-specific visual/branding audits remain in preview CI; do not block production-only deploys.
          node scripts/build-branded-previews.mjs
          node --test --test-concurrency=1 --test-skip-pattern='111 preview prospects have 103 unique bespoke-aware redesign signatures' tests/*.test.mjs
      - name: Materialize only owner-approved customer websites
        if: env.FIREBASE_READY == 'true'
        run: node scripts/materialize-approved-sites.mjs
      - name: Validate public static customer pages
        if: env.FIREBASE_READY == 'true'
        run: npm run check
      - name: Audit publicly deployable files and storage use
        if: env.FIREBASE_READY == 'true'
        run: node scripts/hosting-audit.mjs
      - name: Verify live Supabase production preflight and private endpoints
        if: env.FIREBASE_READY == 'true'
        run: node scripts/smoke-production-cors.mjs
      - name: Deploy only static assets to Firebase Hosting Classic
        if: env.FIREBASE_READY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live

# Production-only deployment requested: 2026-11-10 (manual trigger via GitHub push)
