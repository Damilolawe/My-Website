name: Remaining template visual acceptance

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'scripts/qa-catalog-visual.mjs'
      - 'scripts/qa-zip-template-browser.py'
      - '.github/workflows/catalog-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build and check project
        run: |
          npm ci
          npm run build
          npm run check
          npm test
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Render all remaining templates at four viewport sizes
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 >/tmp/awe-catalog-http.log 2>&1 &
          sleep 2
          npm run qa:catalog
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-visual-qa
          path: catalog-visual-artifacts/
          retention-days: 7
          if-no-files-found: warn
