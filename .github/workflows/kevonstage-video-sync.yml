name: Sync KevOnStage latest video

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-kevonstage-video.mjs'
      - '.github/workflows/kevonstage-video-sync.yml'
  schedule:
    - cron: '20 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kevonstage-latest-video-sync
  cancel-in-progress: true

jobs:
  sync-latest-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout website sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read official YouTube uploads feeds
        run: node scripts/sync-kevonstage-video.mjs
      - name: Commit and deploy only when a newer upload is found
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- preview/kevonstage/index.html preview/kevonstage/latest-videos.txt; then
            echo "No newly published video; no commit or deployment necessary."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/kevonstage/index.html preview/kevonstage/latest-videos.txt
          git commit -m 'Sync KevOnStage newest official YouTube upload'
          git push origin HEAD:main
          gh workflow run branded-previews.yml --ref main
