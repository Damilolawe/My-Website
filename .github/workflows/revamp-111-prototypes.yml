name: Prototype visual review
on:
  workflow_dispatch:
  push:
    branches: [awe-111-prototype-revamp]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/revamp-prospect-sites.mjs
      - run: node scripts/qa-111-prototypes.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-screenshots
          path: qa/111-prototype-screenshots/
