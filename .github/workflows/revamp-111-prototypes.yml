name: Prototype visual review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [prototype-redesign-review]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate all 111 redesigns
        run: |
          if [ -f qa/111-prospect-revamp.json ]; then
            node -e "const q=require('./qa/111-prospect-revamp.json'); if(q.count!==111)process.exit(1); console.log('Using 111 existing redesigns')"
          else
            node scripts/revamp-prospect-sites.mjs
          fi
      - name: Build deployable previews
        run: node scripts/build-branded-previews.mjs
      - name: Run desktop and mobile visual checks
        run: node scripts/qa-111-prototypes.mjs
      - name: Upload redesigned website files and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awe-111-redesigns-and-screenshots
          path: |
            preview/
            artifacts/prospect-111-qa/
            qa/111-prospect-revamp.json
          retention-days: 14
