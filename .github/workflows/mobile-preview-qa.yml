name: Mobile preview visual QA

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'scripts/qa-mobile-previews.mjs'
      - 'qa/mobile-request.json'
      - '.github/workflows/mobile-preview-qa.yml'
  workflow_dispatch:
    inputs:
      sites:
        description: 'Comma-separated preview slugs (leave blank for all)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: awe-mobile-preview-qa
  cancel-in-progress: true

jobs:
  mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        run: npx playwright install chromium
      - name: Audit live mobile previews
        id: audit
        continue-on-error: true
        env:
          PREVIEW_SITES: ${{ inputs.sites }}
          MOBILE_QA_REQUEST_FILE: qa/mobile-request.json
        run: node scripts/qa-mobile-previews.mjs
      - name: Publish screenshots to retrievable GitHub branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d artifacts/mobile-qa ] || [ -z "$(find artifacts/mobile-qa -type f -name '*.jpg' -print -quit)" ]; then
            echo "::warning::No screenshots to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/awe-mobile-qa
          cp artifacts/mobile-qa/*.jpg /tmp/awe-mobile-qa/
          if [ -f artifacts/mobile-qa/report.json ]; then
            cp artifacts/mobile-qa/report.json /tmp/awe-mobile-qa/report.json
          fi
          git fetch origin mobile-qa-screenshots || true
          if git show-ref --verify --quiet refs/remotes/origin/mobile-qa-screenshots; then
            git switch --detach origin/mobile-qa-screenshots
            git switch -c mobile-qa-screenshots
          else
            git switch --orphan mobile-qa-screenshots
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi
          mkdir -p screenshots
          # Replace old captures so the current screenshot branch stays compact.
          find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' \) -delete
          cp /tmp/awe-mobile-qa/*.jpg screenshots/
          if [ -f /tmp/awe-mobile-qa/report.json ]; then
            cp /tmp/awe-mobile-qa/report.json screenshots/report.json
          fi
          printf 'Generated from %s at %s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > screenshots/manifest.txt
          git add -A -f screenshots/
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "Update mobile preview screenshots"
            git push origin HEAD:mobile-qa-screenshots
          fi
      - name: Summarize mobile screenshot delivery
        if: always()
        env:
          QA_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "### Mobile preview QA"
            echo "Screenshots: [mobile-qa-screenshots](https://github.com/Damilolawe/My-Website/tree/mobile-qa-screenshots/screenshots)"
            echo "Detailed findings: [report.json](https://github.com/Damilolawe/My-Website/blob/mobile-qa-screenshots/screenshots/report.json)"
            echo "Automated layout/image checks: **$QA_OUTCOME**"
            echo "Screenshots use Git branches, not GitHub Actions artifact storage."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report audit result
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Mobile layout audit found issues. Review screenshots on mobile-qa-screenshots branch."
          exit 1
