name: Verify ChatGPT Work handoff
on:
  pull_request:
    branches: [main]
    paths:
      - 'platform/**'
      - 'supabase/functions/awe-api/**'
      - 'netlify/functions/api.mjs'
      - 'app/admin.mjs'
      - 'tests/chatgpt-work-handoff.test.mjs'
      - '.github/workflows/work-handoff-ci.yml'
  push:
    branches: [feature/chatgpt-work-handoff-2026-10-26]
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check platform/work-handoff.mjs
      - run: node --check platform/export.mjs
      - run: node --check platform/production.mjs
      - run: node --check netlify/functions/api.mjs
      - run: node --check app/admin.mjs
      - run: node --test tests/chatgpt-work-handoff.test.mjs
