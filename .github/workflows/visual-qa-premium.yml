name: Visual QA — Awe premium templates

on:
  pull_request:
    paths:
      - 'shared/**'
      - 'app/**'
      - 'scripts/qa-premium-browser.py'
      - '.github/workflows/visual-qa-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare static template catalog
        run: |
          npm ci
          npm run build
          npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Capture desktop and mobile designs and log layout faults
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/awe-qa-http.log 2>&1 &
          sleep 2
          python scripts/qa-premium-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-template-browser-qa
          path: qa-output/
          retention-days: 7
