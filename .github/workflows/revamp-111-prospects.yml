name: Revamp 111 prospect prototypes and screenshot QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/revamp-prospect-sites.mjs'
      - 'scripts/qa-111-prototypes.mjs'
      - '.github/workflows/revamp-111-prospects.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awe-111-prospect-revamp
  cancel-in-progress: false

jobs:
  redesign-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout existing Awe Concepts sources
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create unique brand-aware redesigns for exactly 111 generic sites
        run: node scripts/revamp-prospect-sites.mjs
      - name: Build isolated preview hosting site
        run: node scripts/build-branded-previews.mjs
      - name: Check all 169 prospect pages and retained preview footer
        run: node --test tests/large-scale-batch-one.test.mjs tests/preview-no-pictographs.test.mjs tests/branded-previews.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Take 111 desktop and 111 mobile screenshots and audit layouts
        id: visual-qa
        continue-on-error: true
        run: node scripts/qa-111-prototypes.mjs
      - name: Upload screenshot archive and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redesigned-111-desktop-mobile-screenshots
          path: artifacts/prospect-111-qa/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 4
      - name: Commit 111 redesigned source websites
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/ qa/111-prospect-revamp.json
          if git diff --cached --quiet; then
            echo "No source changes to publish"
          else
            git commit -m "Revamp 111 individual prospect websites"
            git push origin HEAD:main
          fi
      - name: Require configured isolated Firebase preview hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test "$FIREBASE_PROJECT_ID" = "awe-digital"
          test -n "$FIREBASE_SERVICE_ACCOUNT"
      - name: Deploy the previews without touching main Awe Concepts website
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ vars.FIREBASE_PROJECT_ID }}'
          entryPoint: 'branded-previews'
          target: 'previews'
          channelId: live
          disableComment: true
      - name: Publish visual contact sheets to retrievable QA branch
        if: always()
        run: |
          set -euo pipefail
          if ! compgen -G 'artifacts/prospect-111-qa/contact-*.jpg' >/dev/null; then exit 0; fi
          mkdir -p /tmp/awe-prospect-review
          cp artifacts/prospect-111-qa/contact-*.jpg /tmp/awe-prospect-review/
          cp artifacts/prospect-111-qa/qa-results.json /tmp/awe-prospect-review/
          git fetch origin prospect-111-qa || true
          if git show-ref --verify --quiet refs/remotes/origin/prospect-111-qa; then
            git switch -C prospect-111-qa origin/prospect-111-qa
          else
            git switch --orphan prospect-111-qa
            git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          fi
          mkdir -p review
          cp /tmp/awe-prospect-review/* review/
          git add -f review/
          if ! git diff --cached --quiet; then
            git commit -m "Publish 111 prospect desktop and mobile contact sheets"
            git push origin HEAD:prospect-111-qa
          fi
      - name: Make visual failures explicit
        if: steps.visual-qa.outcome == 'failure'
        run: |
          echo "::error::At least one screenshot audit check failed; see the QA artifact and contact sheets for specific pages."
          exit 1
