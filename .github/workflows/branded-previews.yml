name: Branded Awe Concepts public previews (validate)

# The live preview site (preview.aweconcepts.com) is served by Cloudflare,
# which builds and deploys from main via its own Git integration. Firebase is
# no longer the host, so this workflow no longer deploys anywhere — it builds
# and validates the allowlisted public concepts so a broken preview, a missing
# file, or an original-site link fails CI before it reaches main.

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'branded-previews/**'
      - 'qa/active-previews-allowlist.json'
      - 'scripts/build-branded-previews.mjs'
      - 'scripts/publish-selected-previews.mjs'
      - 'scripts/rewrite-kappo-preview-urls.mjs'
      - 'scripts/validate-preview-icons.mjs'
      - 'scripts/import-shotsbyriq-photos.mjs'
      - 'scripts/preview-link-policy.mjs'
      - 'tests/active-previews-allowlist.test.mjs'
      - 'tests/branded-previews.test.mjs'
      - 'tests/preview-image-csp.test.mjs'
      - 'tests/preview-no-pictographs.test.mjs'
      - 'tests/preview-original-link-policy.test.mjs'
      - 'tests/kappo-sono-preview.test.mjs'
      - 'tests/otaku-haven-preview.test.mjs'
      - 'tests/susukino-preview.test.mjs'
      - 'tests/bao-dumpling-preview.test.mjs'
      - 'tests/mesa-bar-preview.test.mjs'
      - 'tests/casa-serra-preview.test.mjs'
      - 'tests/solerum-preview.test.mjs'
      - 'tests/jj-deli-preview.test.mjs'
      - 'tests/chong-preview.test.mjs'
      - 'tests/large-scale-batch-one.test.mjs'
      - 'tests/fat-boy-finesse-preview.test.mjs'
      - '.github/workflows/branded-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awe-branded-public-previews
  cancel-in-progress: true

jobs:
  validate-public-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public preview sources
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build allowlisted public concepts
        run: node scripts/build-branded-previews.mjs
      - name: Validate navigation, public-only output and link policy
        run: node --test --test-concurrency=1 tests/active-previews-allowlist.test.mjs tests/branded-previews.test.mjs tests/preview-image-csp.test.mjs tests/kappo-sono-preview.test.mjs tests/otaku-haven-preview.test.mjs tests/preview-no-pictographs.test.mjs tests/susukino-preview.test.mjs tests/bao-dumpling-preview.test.mjs tests/mesa-bar-preview.test.mjs tests/casa-serra-preview.test.mjs tests/solerum-preview.test.mjs tests/jj-deli-preview.test.mjs tests/chong-preview.test.mjs tests/large-scale-batch-one.test.mjs tests/preview-original-link-policy.test.mjs tests/fat-boy-finesse-preview.test.mjs
      - name: Assemble selected-prospect public bundle (allowlist invariants)
        run: node scripts/publish-selected-previews.mjs
