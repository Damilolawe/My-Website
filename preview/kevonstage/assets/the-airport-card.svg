<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" role="img" aria-label="The Airport Tubi series promotional card artwork">
<defs>
<linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d1120"/><stop offset=".55" stop-color="#1b2135"/><stop offset="1" stop-color="#3a2a5c"/></linearGradient>
<linearGradient id="ribg" x1="0" x2="0" y2="1"><stop stop-color="#f6c447"/><stop offset="1" stop-color="#d89a24"/></linearGradient>
</defs>
<rect width="480" height="640" fill="url(#skyg)"/>
<!-- faint runway stripes -->
<g opacity=".16" stroke="#fff" stroke-width="2" stroke-dasharray="14 14">
  <line x1="60" y1="600" x2="420" y2="600"/>
  <line x1="60" y1="620" x2="420" y2="620"/>
</g>
<!-- stylized plane -->
<g transform="translate(240 320) rotate(-18)" fill="#fff5e9" opacity=".92">
  <path d="M-110 0 L50 -8 L120 -28 L140 -16 L62 10 L50 22 L-30 24 L-68 40 L-82 30 L-50 12 L-110 0 Z"/>
  <path d="M10 -6 L28 -52 L42 -50 L30 -4 Z" opacity=".8"/>
  <path d="M-4 10 L-18 60 L-30 58 L-18 8 Z" opacity=".6"/>
</g>
<!-- Tubi-style orange ribbon -->
<rect x="56" y="88" width="138" height="26" fill="url(#ribg)" rx="4"/>
<text x="68" y="107" font-family="Arial Black,Arial,sans-serif" font-size="14" font-weight="900" letter-spacing="2.4" fill="#1a1308">TUBI · PREMIERES</text>
<text x="56" y="460" font-family="Arial Black,Arial,sans-serif" font-size="78" font-weight="900" fill="#fff5e9">THE</text>
<text x="56" y="536" font-family="Arial Black,Arial,sans-serif" font-size="78" font-weight="900" fill="#f6c447">AIRPORT</text>
<text x="56" y="586" font-family="Arial,sans-serif" font-size="22" letter-spacing="3" fill="#dcd4c3">A NEW TUBI SERIES</text>
</svg>
