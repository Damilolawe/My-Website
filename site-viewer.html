<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Reviewed website | Awe Concepts</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;width:100%;margin:0;font-family:system-ui,Arial,sans-serif}
    body{background:#0c0d10;color:#f5f5ee}
    #viewer-status{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:15px}
    #viewer-status h1{font-size:clamp(22px,4vw,40px);line-height:1.14;margin:0}
    #viewer-status p{max-width:48ch;line-height:1.6;color:#c9c9c2;margin:0}
    #viewer-status a{color:#d1fa57;text-decoration-thickness:2px;text-underline-offset:4px}
    iframe{display:block;position:fixed;width:100%;height:100dvh;inset:0;border:0;background:#fff}
    [hidden]{display:none!important}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
  <script type="module" src="/site-viewer.js"></script>
</head>
<body data-awe-public-viewer="v1">
  <main id="viewer-status" role="status" aria-live="polite">
    <h1>Opening your website</h1>
    <p id="viewer-message">Checking the approved version.</p>
    <a href="/" aria-label="Visit Awe Concepts">Awe Concepts studio</a>
  </main>
  <iframe id="approved-site" hidden title="Approved customer website"
    sandbox="allow-popups allow-popups-to-escape-sandbox"
    referrerpolicy="no-referrer" loading="eager"></iframe>
</body>
</html>
